plugins { id 'com.android.application' }

android {
    namespace 'com.ayman.casinohub'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ayman.casinoelal3ab.hub'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.2.0'
    }
    buildTypes { release { minifyEnabled false } }
    // Reuse exactly the browser pages and original 1000 questions of the CasaOS version.
    sourceSets {
        main {
            assets.srcDirs += [
                file("${rootProject.projectDir}/../public"),
                file("${rootProject.projectDir}/../questions")
            ]
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
    testImplementation 'junit:junit:4.13.2'
}
