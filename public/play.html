<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اللاعب | Casino Party LAN</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="container narrow"><header class="hero"><div class="brand">🎮 CASINO PARTY LAN</div><h1 id="room">لعبة الجرس</h1><span id="connection" class="pill red">جاري الاتصال...</span></header>
<section class="card" id="joinPanel"><h2>دخول اللاعب</h2><form id="joinForm"><label for="name">اسمك</label><input id="name" name="name" maxlength="24" autocomplete="nickname" placeholder="اكتب اسمك" required><button class="action block" type="submit">ادخل الغرفة</button></form></section>
<section class="card center" id="gamePanel" hidden><div class="row between"><strong id="playerName"></strong><span class="pill gold" id="score">0 نقطة</span></div><h2 id="status" style="margin-top:20px">مستني المذيع</h2><p class="muted" id="detail">الجرس هيفتح بعد بدء الجولة</p><div class="buzz-wrap"><button class="buzzer" type="button" id="buzzer" disabled aria-label="الضغط على الجرس">🔔<br>الجرس</button></div><p class="notice" id="feedback" role="status"></p><div class="row center-controls">
  <button class="action secondary" id="rename" type="button">تغيير الاسم</button>
  <button class="action secondary" id="soundToggle" type="button" aria-pressed="true">🔊 الصوت شغال</button>
</div><p class="muted small" id="soundHint">صوت عند ضغط الجرس، وصوت مختلف لو كسبت الجولة. مفيش صوت قفل.</p></section>
<section class="card"><h3>🏆 ترتيب اللاعبين</h3><ul class="score-list" id="scores"><li class="muted">لاعبين الغرفة هيظهروا هنا</li></ul></section><footer><a href="/">الرئيسية</a></footer></main>
<script src="/shared.js"></script><script src="/audio.js"></script><script src="/play.js"></script></body></html>
