<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المذيع | Casino Party LAN</title><link rel="stylesheet" href="/style.css"></head><body>
<main class="container"><header class="hero"><div class="brand">🎙️ CASINO PARTY LAN</div><h1>لوحة تحكم المذيع</h1><span id="connection" class="pill red">جاري الاتصال...</span></header>
<section class="card narrow" id="loginPanel"><h2>تسجيل دخول المذيع</h2><form id="loginForm"><label for="pin">كلمة مرور ADMIN_PIN</label><input id="pin" name="pin" type="password" minlength="8" autocomplete="off" required><button class="action block">دخول</button></form><p id="loginFeedback" class="notice"></p></section>
<div id="controls" hidden><section class="card"><div class="row between"><h2>إدارة الجرس</h2><span class="pill" id="phase">مستنيين</span></div><p>الجولة: <strong id="round">0</strong> | <span id="winner">مفيش حد كسب الجرس</span></p><p class="muted" id="lastEvent"></p>
<div class="btn-grid"><button class="action positive" data-action="open" id="open">🔔 افتح جولة جديدة</button><button class="action positive" data-action="correct" id="correct">✅ إجابة صح</button><button class="action negative" data-action="wrong" id="wrong">❌ غلط — افتح للباقي</button><button class="action secondary" data-action="close" id="close">🔒 اقفل الجرس</button></div><p id="feedback" class="notice" role="status"></p></section>
<section class="card"><div class="row between"><h2>اللاعبون والنقاط</h2><span class="pill" id="count">0 لاعب</span></div><ul class="score-list" id="players"></ul></section>
<section class="card"><h2>أدوات إعادة الضبط</h2><div class="btn-grid"><button class="action gold" id="resetScores">تصفير النقاط</button><button class="action negative" id="clearPlayers">حذف كل اللاعبين</button></div><p class="muted small">حذف اللاعبين يلغي رموز الدخول القديمة، لكن يحتفظ بملف قاعدة البيانات.</p></section></div><footer><a href="/">الرئيسية</a> · <a href="/screen" target="_blank" rel="noopener">شاشة النتائج</a></footer></main>
<script src="/shared.js"></script><script src="/admin.js"></script></body></html>
