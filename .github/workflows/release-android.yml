name: Publish Android APK release
on:
  push:
    branches:
      - "main"
permissions:
  contents: write
jobs:
  android-apk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Confirm Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK found: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK for CasaOS
        run: cp android/app/build/outputs/apk/debug/app-debug.apk casino-elal3ab.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          target_commitish: main
          name: Casino El Al3ab v0.1.2
          files: casino-elal3ab.apk
          body: |
            Casino El Al3ab Android client for CasaOS LAN.
            Install on Android, enter the CasaOS mini-PC IP and port, then play.
            This test APK is signed using a temporary debug key; later versions may need reinstalling.
            v0.1.2: Instant local tap bell. Success chime only after the host marks the answer correct and awards the player's points. No lock sound.
            Mute/unmute is available in player UI and saved locally.
            Same-Wi-Fi and LAN connection required.
