name: Publish Android APK release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  android-apk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK for CasaOS
        run: cp android/app/build/outputs/apk/debug/app-debug.apk casino-elal3ab.apk
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Casino El Al3ab ${{ github.ref_name }}
          files: casino-elal3ab.apk
          body: |
            Casino El Al3ab Android client for CasaOS LAN.
            Install on Android, enter the CasaOS mini-PC IP and port, then play.
            This test APK is signed using a temporary debug key; later versions may need reinstalling.
            Same-Wi-Fi and LAN connection required.
