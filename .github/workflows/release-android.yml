name: Publish Android APK release
on:
  push:
    branches:
      - "main"
permissions:
  contents: write
jobs:
  android-apk-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Confirm Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK found: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Bundle licensed bell into the hub APK (optional)
        run: |
          mkdir -p android/hub/src/main/assets
          curl -fL --retry 2 --connect-timeout 8 --max-time 45 \
            "https://www.orangefreesounds.com/wp-content/uploads/2015/04/Desk-bell-sound.mp3" \
            -o android/hub/src/main/assets/bell.mp3 || rm -f android/hub/src/main/assets/bell.mp3
      - name: Assemble player and phone-hub APKs
        working-directory: android
        run: gradle :hub:testDebugUnitTest :app:assembleDebug :hub:assembleDebug --no-daemon
      - name: Name both Android APKs
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk casino-elal3ab.apk
          cp android/hub/build/outputs/apk/debug/hub-debug.apk casino-elal3ab-hub.apk
      - name: Include real desk bell when downloadable
        run: |
          # Alexander / Orange Free Sounds — CC BY 4.0
          curl -fL --retry 2 --connect-timeout 8 --max-time 45 \
            "https://www.orangefreesounds.com/wp-content/uploads/2015/04/Desk-bell-sound.mp3" \
            -o bell.mp3 || rm -f bell.mp3
          if [ -s bell.mp3 ]; then echo "Physical bell downloaded"; else echo "Physical bell unavailable; local synthesized fallback works"; fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          target_commitish: main
          name: Casino El Al3ab v0.2.0
          files: |
            casino-elal3ab.apk
            casino-elal3ab-hub.apk
            bell.mp3
          body: |
            Casino El Al3ab Android client for CasaOS LAN.
            Install on Android, enter the CasaOS mini-PC IP and port, then play.
            This test APK is signed using a temporary debug key; later versions may need reinstalling.
            v0.2.0: NEW Android phone-hosted Hub APK. One Android phone hosts the full 1000-question HTTP/WebSocket game; other devices join via Wi-Fi/hotspot with browser or player APK. No CasaOS required.
            Score +1 correct, -1 wrong; buzzer reopens for everybody. Yellow -1, red -3. Optional recorded desk bell (CC BY 4.0).
            Mute/unmute is available in player UI and saved locally.
            Physical bell recording by Alexander / Orange Free Sounds (CC BY 4.0):
            https://orangefreesounds.com/desk-bell-sound/
            Same-Wi-Fi and LAN connection required.
