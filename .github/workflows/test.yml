name: Validate server, Docker and Android
concurrency:
  group: phone-hub-validation-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Validate install script and Docker Compose
        run: |
          bash -n install-casaos.sh doctor-casaos.sh
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
      - name: Check optional real desk bell source (nonblocking)
        run: |
          curl -fLsS --connect-timeout 7 --max-time 20 'https://www.orangefreesounds.com/wp-content/uploads/2015/04/Desk-bell-sound.mp3' -o /tmp/desk-bell-sample.mp3 && wc -c /tmp/desk-bell-sample.mp3 || echo 'Recording unavailable; synthesized fallback still works'
      - name: Build Docker container
        run: docker build -t casino-party-lan:test .
      - name: Smoke test the built image
        run: |
          mkdir -p /tmp/casino-smoke
          chmod 777 /tmp/casino-smoke
          docker run -d --name casino-smoke --rm \
            -e ADMIN_PIN=github-actions-secret-24680 \
            -p 127.0.0.1:33919:3000 \
            -v /tmp/casino-smoke:/app/data \
            casino-party-lan:test
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:33919/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:33919/play > /dev/null
          curl -fsS http://127.0.0.1:33919/audio.js > /dev/null
          docker stop casino-smoke
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Confirm Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Android SDK found: $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build both Android APKs + test hub buzzer rules
        run: gradle :hub:testDebugUnitTest :app:assembleDebug :hub:assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: casino-elal3ab-player-and-hub-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/hub/build/outputs/apk/debug/hub-debug.apk

  phone-hub-emulator-smoke:
    needs: android-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: casino-elal3ab-player-and-hub-apks
          path: .
      - name: Check APK assets
        run: |
          test -s android/hub/build/outputs/apk/debug/hub-debug.apk
          unzip -Z1 android/hub/build/outputs/apk/debug/hub-debug.apk | grep -q 'assets/text_only_1000.json'
          unzip -Z1 android/hub/build/outputs/apk/debug/hub-debug.apk | grep -q 'assets/admin.html'
          unzip -Z1 android/hub/build/outputs/apk/debug/hub-debug.apk | grep -q 'assets/play.html'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash scripts/test-android-hub.sh
